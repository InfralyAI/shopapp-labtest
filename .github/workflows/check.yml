name: Check pages
on: pull_request
permissions:
  contents: read
jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every page has a title
        run: |
          for f in *.html; do
            grep -q "<title>" "$f" || { echo "Missing <title> in $f"; exit 1; }
          done
          echo "All pages have a title"
